name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional Netlify HTTPS URL for Sheikh AI API (e.g. https://your-site.netlify.app)'
        required: false
        default: ''
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor Android
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
        run: |
          npm run build
          npx cap sync android

      - name: Compile Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-quran-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
